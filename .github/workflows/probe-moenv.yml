name: Probe MOENV API
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_moenv.py
      - .github/workflows/probe-moenv.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moenv-api-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read one record per dataset without logging credentials
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: python scripts/probe_moenv.py
      - name: Save sanitized probe report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/environment/api-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record sanitized MOENV API probe results'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
