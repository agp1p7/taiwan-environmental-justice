name: Observe current pollution download without restarting it
on:
  push:
    branches: [main]
    paths: [.github/workflows/observe-pollution-history.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: observe-pollution-history
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read actual download run status and publish metadata only
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {execFileSync} = require('child_process');
            const target = 'aafc3fe851204519bceec26137e482fc00941830';
            const workflow = 'download-pollution-history.yml';
            const path = 'reports/pollution-history/run-status.json';
            const git = (...args) => execFileSync('git', args, {stdio: 'pipe'});
            git('config','user.name','github-actions[bot]');
            git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');
            for (let poll=0; poll<23; poll++) {
              let report = {checked_at_utc: new Date().toISOString(), target_commit: target, target_workflow: workflow, monitor_run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, environment_api_requests: 0, download_restarted: false, site_changed: false};
              let stop = false;
              try {
                const response = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: workflow, per_page: 100});
                const matching = response.data.workflow_runs.filter(r => r.head_sha === target).sort((a,b) => b.id-a.id);
                if (!matching.length) {
                  report.download_run_status = 'not_found';
                  report.download_run_conclusion = null;
                  if (poll>=2) {stop=true; report.monitor_stop_reason='no_matching_run_found';}
                } else {
                  const run = matching[0];
                  report.download_run_id = run.id;
                  report.download_run_url = run.html_url;
                  report.download_run_status = run.status;
                  report.download_run_conclusion = run.conclusion;
                  report.download_run_created_at = run.created_at;
                  report.download_run_updated_at = run.updated_at;
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner: context.repo.owner, repo: context.repo.repo, run_id: run.id, per_page: 100});
                  report.jobs = jobs.map(j => ({name: j.name, status: j.status, conclusion: j.conclusion, started_at: j.started_at, completed_at: j.completed_at, steps: (j.steps || []).map(s => ({name: s.name, status: s.status, conclusion: s.conclusion}))}));
                  if (run.status === 'completed') {stop=true; report.monitor_stop_reason='target_run_completed';}
                }
              } catch (error) {
                report.download_run_status = 'status_lookup_failed';
                report.lookup_http_status = Number.isInteger(error.status) ? error.status : null;
                stop=true; report.monitor_stop_reason='github_status_lookup_failed';
              }
              if (poll===22 && !stop) {stop=true; report.monitor_stop_reason='observation_window_ended_not_a_download_result';}
              report.monitor_finished = stop;
              report.poll_number = poll+1;
              fs.mkdirSync('reports/pollution-history', {recursive: true});
              fs.writeFileSync(path, JSON.stringify(report));
              git('add',path);
              git('commit','-m','Record actual pollution download workflow status');
              git('fetch','origin','main');
              git('rebase','origin/main');
              git('push','origin','HEAD:main');
              core.info(JSON.stringify({poll: poll+1, download_status: report.download_run_status, conclusion: report.download_run_conclusion || null, monitor_finished: stop}));
              if (stop) break;
              await new Promise(resolve => setTimeout(resolve,120000));
            }
