name: Integrated 2024 historical audit and reanalysis
on:
  push:
    branches: [main]
    paths:
      - scripts/integrated_reanalysis_2024.py
      - .github/workflows/integrated-reanalysis-2024.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: integrated-reanalysis-2024
  cancel-in-progress: false
jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 beautifulsoup4==4.12.3
      - name: Find saved raw and official income artifacts
        id: sources
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const annual = JSON.parse(fs.readFileSync('reports/annual-means/summary.json','utf8'));
            const runId = Number(annual.actions_run_url.split('/').pop());
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id:runId,per_page:100});
            const raw = data.artifacts.filter(a=>a.name==='annual-means-pages'&&!a.expired);
            if(raw.length===1) core.setOutput('raw_run_id',String(runId));
            const income = await github.rest.actions.listArtifactsForRepo({owner:context.repo.owner,repo:context.repo.repo,name:'official-income-2024',per_page:100});
            const live = income.data.artifacts.filter(a=>!a.expired&&a.workflow_run&&a.workflow_run.head_branch==='main').sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
            if(live.length)core.setOutput('income_run_id',String(live[0].workflow_run.id));
      - name: Restore saved hourly data without environmental API requests
        if: steps.sources.outputs.raw_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: annual-means-pages
          run-id: ${{ steps.sources.outputs.raw_run_id }}
          github-token: ${{ github.token }}
          path: annual-means/
      - name: Restore income archive when not expired
        if: steps.sources.outputs.income_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: official-income-2024
          run-id: ${{ steps.sources.outputs.income_run_id }}
          github-token: ${{ github.token }}
          path: official-income/
      - name: Run all audit, pairing, validity and comparison stages
        id: pipeline
        continue-on-error: true
        run: python scripts/integrated_reanalysis_2024.py
      - name: Preserve reports and verified source archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-reanalysis-2024-${{ github.run_id }}
          path: |
            reports/integrated-reanalysis-2024/
            annual-means/
            official-income/official-html.zip
          retention-days: 14
          if-no-files-found: error
      - name: Commit new result directory only
        if: always()
        run: |
          if [ ! -d reports/integrated-reanalysis-2024 ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/integrated-reanalysis-2024/
          if ! git diff --cached --quiet; then
            git commit -m 'Record integrated 2024 historical mapping and validity reanalysis'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Require final statistics
        if: always()
        run: test '${{ steps.pipeline.outcome }}' = 'success'
