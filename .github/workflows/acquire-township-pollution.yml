name: Acquire township pollution data preflight
on:
  push:
    branches: [main]
    paths:
      - scripts/acquire_township_pollution.py
      - .github/workflows/acquire-township-pollution.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: township-pollution-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find the same approved original income snapshot
        id: source
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'official-income.yml', branch: 'main', status: 'success', per_page: 100});
            const run = data.workflow_runs.find(r => r.head_sha === 'cf7d437de174ae2c31116f280281469cfffb4c86');
            if (!run) throw new Error('Approved saved income snapshot unavailable; no automatic redownload');
            core.setOutput('run_id', String(run.id));
      - name: Restore original official HTML without new FIA downloads
        if: steps.source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: official-income-2024
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: income-source/
      - name: Install income HTML parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Check township aggregates and at most fourteen official API requests
        id: acquire
        continue-on-error: true
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: python scripts/acquire_township_pollution.py
      - name: Record execution status without exposing credentials
        if: always()
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquire.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('reports/pollution-acquisition/status.json')
          run='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          r=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          if r.get('actions_run_url')!=run:r={'status':'script_failed_before_report' if os.environ.get('ACQUISITION_OUTCOME')=='failure' else 'not_run'}
          r.update({'actions_run_url':run,'script_outcome':os.environ.get('ACQUISITION_OUTCOME'),'full_year_downloaded':False,'annual_concentrations_computed':False,'site_changed':False,'township_csv_updated':Path('pollution-acquisition/township-income-candidates.csv').exists()})
          p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          if Path('pollution-acquisition/township-income-candidates.csv').exists():
              import shutil
              shutil.copyfile('pollution-acquisition/township-income-candidates.csv','reports/pollution-acquisition/township-income-candidates.csv')
          PY
      - name: Save only acquired official metadata samples and aggregate candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: township-pollution-acquisition
          path: |
            pollution-acquisition/
            reports/pollution-acquisition/status.json
          retention-days: 7
          if-no-files-found: warn
      - name: Commit acquisition status and aggregate candidate CSV only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in reports/pollution-acquisition/status.json reports/pollution-acquisition/township-income-candidates.csv; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record bounded pollution data acquisition and township income candidates'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Require completed preflight execution, not full-year readiness
        if: always()
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquire.outcome }}
        run: test "$ACQUISITION_OUTCOME" = "success"
