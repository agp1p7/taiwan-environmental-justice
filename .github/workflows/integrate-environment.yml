name: Build environmental integration preview
on:
  push:
    branches: [main]
    paths:
      - scripts/integrate_environment.py
      - scripts/audit_environment_quality.py
      - scripts/test_environment_preview.py
      - templates/environment-preview.html
      - templates/kiang-salary-LICENSE.txt
      - .github/workflows/integrate-environment.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: environmental-integration-preview
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find approved completed source runs
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            for (const [key, workflow, sha] of [['environment','download-moenv.yml','8b03343b4261e1f7b07870fe68d8f8702677d639'],['income','map-official-income.yml','3a063816ed989a3b0f947283d3b68bae24060e40']]) {
              const {data} = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: workflow, branch: 'main', status: 'success', per_page: 100});
              const run = data.workflow_runs.find(r => r.head_sha === sha);
              if (!run) throw new Error('Approved completed source not found: ' + key);
              core.setOutput(key + '_run', String(run.id));
            }
      - uses: actions/download-artifact@v4
        with:
          name: moenv-paged-checkpoint
          run-id: ${{ steps.source.outputs.environment_run }}
          github-token: ${{ github.token }}
          path: environment-source/
      - uses: actions/download-artifact@v4
        with:
          name: official-income-map-2024
          run-id: ${{ steps.source.outputs.income_run }}
          github-token: ${{ github.token }}
          path: income-source/
      - name: Install tested spatial engine and browser test runner
        run: |
          python -m pip install shapely==2.1.1 playwright
          python -m playwright install --with-deps chromium
      - name: Clean and spatially join saved sources without environmental API calls
        run: python scripts/integrate_environment.py --environment environment-source --income income-source
      - name: Audit zero-coordinate fields and boundary repair candidates without applying them
        run: python scripts/audit_environment_quality.py --environment environment-source --income income-source --preview integrated-preview
      - name: Preserve upstream license in preview
        run: cp templates/kiang-salary-LICENSE.txt integrated-preview/UPSTREAM-LICENSE.txt
      - name: Test desktop and mobile preview in Chromium
        id: browser
        continue-on-error: true
        run: python scripts/test_environment_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environmental-integration-preview
          path: integrated-preview/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit quality and browser acceptance reports only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in reports/environment/integration-quality.json reports/environment/quality-followup.json reports/environment/browser-acceptance.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record data quality and actual browser acceptance'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Require passed browser acceptance
        if: always()
        run: test "${{ steps.browser.outcome }}" = "success"
