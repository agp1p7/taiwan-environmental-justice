name: Build environmental integration preview
on:
  push:
    branches: [main]
    paths:
      - scripts/integrate_environment.py
      - templates/environment-preview.html
      - .github/workflows/integrate-environment.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: environmental-integration-preview
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find approved completed source runs
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            for (const [key, workflow, sha] of [['environment','download-moenv.yml','8b03343b4261e1f7b07870fe68d8f8702677d639'],['income','map-official-income.yml','3a063816ed989a3b0f947283d3b68bae24060e40']]) {
              const {data} = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: workflow, branch: 'main', status: 'success', per_page: 100});
              const run = data.workflow_runs.find(r => r.head_sha === sha);
              if (!run) throw new Error('Approved completed source not found: ' + key);
              core.setOutput(key + '_run', String(run.id));
            }
      - uses: actions/download-artifact@v4
        with:
          name: moenv-paged-checkpoint
          run-id: ${{ steps.source.outputs.environment_run }}
          github-token: ${{ github.token }}
          path: environment-source/
      - uses: actions/download-artifact@v4
        with:
          name: official-income-map-2024
          run-id: ${{ steps.source.outputs.income_run }}
          github-token: ${{ github.token }}
          path: income-source/
      - name: Install tested spatial engine
        run: python -m pip install shapely==2.1.1
      - name: Clean and spatially join saved sources without environmental API calls
        run: python scripts/integrate_environment.py --environment environment-source --income income-source
      - uses: actions/upload-artifact@v4
        with:
          name: environmental-integration-preview
          path: integrated-preview/
          retention-days: 7
          if-no-files-found: error
      - name: Commit integration quality report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/environment/integration-quality.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record environmental cleaning and guarded village matching quality'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
