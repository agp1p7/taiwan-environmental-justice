name: Compute annual means from verified 2024 pollution data
on:
  push:
    branches: [main]
    paths:
      - scripts/compute_annual_means.py
      - .github/workflows/compute-annual-means.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: compute-annual-means
  cancel-in-progress: false
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find prior checkpoint artifact to resume without redownloading
        id: checkpoint
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listArtifactsForRepo({owner: context.repo.owner, repo: context.repo.repo, name: 'annual-means-pages', per_page: 100});
            const a = data.artifacts.filter(a => !a.expired && a.workflow_run && a.workflow_run.head_branch === 'main' && a.workflow_run.id !== context.runId).sort((a,b) => Date.parse(b.created_at)-Date.parse(a.created_at));
            if (a.length) core.setOutput('run_id', String(a[0].workflow_run.id));
      - name: Restore verified annual pages if available
        if: steps.checkpoint.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: annual-means-pages
          run-id: ${{ steps.checkpoint.outputs.run_id }}
          github-token: ${{ github.token }}
          path: annual-means/
      - name: Verify filters then download year and compute annual means
        id: compute
        continue-on-error: true
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: python scripts/compute_annual_means.py
      - name: Preserve raw pages checkpoint and computed means
        if: always()
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: annual-means-pages
          path: annual-means/
          retention-days: 7
          if-no-files-found: warn
      - name: Record outcomes
        if: always()
        env:
          COMPUTE_OUTCOME: ${{ steps.compute.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('reports/annual-means/summary.json');run='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          r=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'status':'not_run','annual_means_computed':False}
          if r.get('actions_run_url')!=run:r={'status':'script_failed_before_report','annual_means_computed':False}
          r.update({'actions_run_url':run,'script_outcome':os.environ.get('COMPUTE_OUTCOME'),'raw_artifact_saved':os.environ.get('ARCHIVE_OUTCOME')=='success' and Path('annual-means/checkpoint.json').exists(),'checked_after_script_at_utc':datetime.now(timezone.utc).isoformat()})
          p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(r,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
      - name: Commit summary and station annual means only
        if: always()
        run: |
          if [ ! -f reports/annual-means/summary.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/annual-means/summary.json
          if [ -f reports/annual-means/station-annual-means.csv ]; then git add reports/annual-means/station-annual-means.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record station annual means for 2024 verified pollution data'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Require computed annual means and saved raw data
        if: always()
        env:
          COMPUTE_OUTCOME: ${{ steps.compute.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('reports/annual-means/summary.json');r=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          if os.environ.get('COMPUTE_OUTCOME')!='success' or r.get('annual_means_computed') is not True or r.get('raw_artifact_saved') is not True:raise SystemExit(1)
          PY
