<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>所得與環境資料驗證預覽</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><p>驗證預覽，未部署。2024所得；圖資年代未驗證；環境資料含歷史紀錄，非違法、曝險或風險判定。未見解除資訊不等於現行列管。</p><label>村里設色 <select id="metric"><option value="income_median">所得中位數（千元）</option><option value="ems01_records">環保管理資料配對紀錄數（非事業數）</option><option value="soil_records">土壤及地下水配對紀錄數（含解除資訊）</option></select></label><p>灰色：該指標無值或圖形未納入配對；紀錄數綠色分級為0、1–5、6–20、21–100、101以上。所得分級為≤400、400–600、600–800、800–1000、>1000。<a href="quality.json">品質報告</a></p><div id="map" style="height:76vh"></div><script>const m=L.map('map',{preferCanvas:true}).setView([23.7,120.6],7),metric=document.getElementById('metric');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(m);const node=t=>{const d=document.createElement('div');d.textContent=t;return d};function style(f){const k=metric.value,v=f.properties[k],cuts=k==='income_median'?[400,600,800,1000]:[0,5,20,100];return{color:'#777',weight:.3,fillOpacity:.65,fillColor:v==null?'#aaa':['#edf8e9','#bae4b3','#74c476','#31a354','#006d2c'][cuts.filter(x=>v>x).length]}}Promise.all(['income.geojson','soil.geojson'].map(p=>fetch(p).then(r=>{if(!r.ok)throw Error('載入失敗');return r.json()}))).then(([g,s])=>{const base=L.geoJSON(g,{style,onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(node([p.COUNTYNAME,p.TOWNNAME,p.VILLNAME,'所得千元：',p.income_median,'管理紀錄數：',p.ems01_records,'土壤紀錄數：',p.soil_records].join(' ')))}}).addTo(m);metric.onchange=()=>base.setStyle(style);const labels={release_information_present:'有解除公告資訊',announcement_without_release_information:'有管制公告資訊，未見解除資訊',announcement_information_unknown:'公告資訊待核對'};const soil=L.geoJSON(s,{pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:3,color:f.properties.announcement_status==='release_information_present'?'#777':'#7141a8',weight:1,fillOpacity:.6}),onEachFeature:(f,l)=>l.bindPopup(node([f.properties.source_id,labels[f.properties.announcement_status],f.properties.spatial_status].join(' ')))});L.control.layers({},{'土壤／地下水紀錄（含解除資訊）':soil}).addTo(m)}).catch(e=>document.body.append(node(e.message)));</script></html>
